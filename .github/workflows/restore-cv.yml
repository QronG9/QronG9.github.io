name: Restore CV PDF

on:
  push:
    paths:
      - '.github/workflows/restore-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify PDF
        shell: bash
        run: |
          cat .cv_parts/part-00.b64 .cv_parts/part-01.b64 .cv_parts/part-02.b64 .cv_parts/part-03.b64 \
            | base64 --decode > Rongrong_Liu_CV.pdf
          test "$(wc -c < Rongrong_Liu_CV.pdf)" -eq 137574
          echo "ad86efb193a6e6ec487d8b6f834f657be5349cb82c52fc4ed0a9841187dd45fb  Rongrong_Liu_CV.pdf" | sha256sum --check --strict
          file Rongrong_Liu_CV.pdf

      - name: Commit reconstructed CV
        shell: bash
        run: |
          rm -rf .cv_parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rongrong_Liu_CV.pdf .cv_parts
          git commit -m "Add downloadable CV PDF"
          git push
